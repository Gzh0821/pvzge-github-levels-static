name: Sync upstream levels

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-levels
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Gzh0821/pvzge-github-levels-static'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream changes without overwriting fork configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main
